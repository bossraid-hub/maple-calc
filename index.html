<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楓之谷成本計算機</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- 頂部導覽列 -->
        <header class="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-calculator text-amber-500"></i> 楓之谷成本計算機 <span class="text-xs bg-amber-500 text-slate-900 px-2 py-0.5 rounded font-mono">V4.9.3</span>
                </h1>
                <p class="text-slate-400 text-sm mt-1">已鎖定連接至 v493 雲端資料庫，確保資料完整讀取與即時同步。</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="switchTab('calc')" id="btn-calc" class="px-4 py-2 bg-amber-600 text-white rounded-lg font-medium transition hover:bg-amber-700 shadow"><i class="fa-solid fa-bolt mr-1"></i> 快速選成品計算</button>
                <button onclick="switchTab('manage')" id="btn-manage" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-medium transition hover:bg-slate-700"><i class="fa-solid fa-boxes-stacked mr-1"></i> 管理成品</button>
                <button onclick="switchTab('recipe')" id="btn-recipe" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-medium transition hover:bg-slate-700"><i class="fa-solid fa-plus-circle mr-1"></i> 新增成品配方</button>
                <button onclick="switchTab('settings')" id="btn-settings" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-medium transition hover:bg-slate-700"><i class="fa-solid fa-gear mr-1"></i> 設定</button>
            </div>
        </header>

        <!-- 主要內容區 -->
        <main class="p-6">
            <!-- 1. 計算分頁 -->
            <div id="tab-calc" class="space-y-6">
                <div class="border-l-4 border-amber-600 pl-4 py-1">
                    <h2 class="text-lg font-bold">1. 輸入基礎「母礦」或「打怪雜物」單價 (即時連動更新)</h2>
                </div>
                <div id="raw-materials-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 動態渲染基礎材料輸入框 -->
                </div>

                <div class="border-l-4 border-amber-600 pl-4 py-1 mt-8">
                    <h2 class="text-lg font-bold">2. 選擇欲製作的成品 / 裝備 / 合成物與測試市場價格</h2>
                </div>
                <div class="bg-amber-50/50 border border-amber-200 rounded-xl p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">選擇項目：</label>
                        <select id="calc-product-select" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-medium focus:ring-2 focus:ring-amber-500 focus:outline-none" onchange="updateCalculation()">
                            <!-- 動態成品選單 -->
                        </select>
                    </div>
                    <div id="calc-result-panel" class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                        <!-- 計算結果動態顯示 -->
                    </div>
                </div>
            </div>

            <!-- 2. 管理成品分頁 -->
            <div id="tab-manage" class="hidden space-y-6">
                <h2 class="text-xl font-bold">成品與配方管理</h2>
                <div id="manage-products-list" class="space-y-4">
                    <!-- 動態管理列表 -->
                </div>
            </div>

            <!-- 3. 新增配方分頁 -->
            <div id="tab-recipe" class="hidden space-y-6">
                <h2 class="text-xl font-bold">新增或編輯成品配方</h2>
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-4">
                    <p class="text-sm text-slate-500">在此新增或調整成品的合成材料需求、NPC 製作費與市場基準價。</p>
                    <!-- 配方表單內容 -->
                </div>
            </div>

            <!-- 4. 設定分頁 -->
            <div id="tab-settings" class="hidden space-y-6">
                <h2 class="text-xl font-bold">系統與資料庫設定</h2>
                <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-4">
                    <p class="text-sm text-slate-600">目前雲端資料庫路徑：<code class="bg-slate-200 px-2 py-1 rounded text-xs font-mono">maple_calculator_v493</code></p>
                    <button onclick="location.reload()" class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-medium hover:bg-slate-800"><i class="fa-solid fa-rotate mr-1"></i> 重新載入並同步雲端</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK 整合與核心邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase 配置設定 (維持原有專案設定)
        const firebaseConfig = {
            databaseURL: "https://maple-calculator-a35a4-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 強制鎖定 v493 節點以救回並保護舊有資料
        const dbRootRef = ref(db, 'maple_calculator_v493');

        window.switchTab = function(tabId) {
            ['calc', 'manage', 'recipe', 'settings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).className = "px-4 py-2 bg-slate-800 text-slate-300 rounded-lg font-medium transition hover:bg-slate-700";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`btn-${tabId}`).className = "px-4 py-2 bg-amber-600 text-white rounded-lg font-medium transition hover:bg-amber-700 shadow";
        };

        // 即時監聽與讀取 v493 資料
        onValue(dbRootRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                console.log("成功載入 v493 雲端資料：", data);
                window.appData = data;
                renderApp();
            } else {
                console.warn("v493 節點尚無資料，初始化預設結構...");
            }
        });

        window.renderApp = function() {
            // 這裡會依據 window.appData 渲染基礎材料與成品清單
            const rawContainer = document.getElementById('raw-materials-container');
            if (window.appData && window.appData.rawMaterials) {
                rawContainer.innerHTML = '';
                for (const [key, mat] of Object.entries(window.appData.rawMaterials)) {
                    rawContainer.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm relative">
                            <span class="text-xs text-slate-400 block">${mat.category || '基礎材料'}</span>
                            <h3 class="font-bold text-slate-800">${mat.name} (單價)</h3>
                            <input type="text" value="${mat.price}" class="w-full mt-2 p-2 border border-slate-300 rounded-lg font-mono font-bold text-slate-700 bg-slate-50" readonly>
                        </div>
                    `;
                }
            }
        }

        window.updateCalculation = function() {
            // 計算邏輯觸發點
        }
    </script>
</body>
</html>

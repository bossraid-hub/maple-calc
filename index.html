<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>經驗與打怪效率計算機</title>
  <!-- 引入 Tailwind CSS 與 Firebase SDK 視專案需求引入 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow p-6">
    
    <h1 class="text-2xl font-bold mb-4 text-gray-800">經驗與打怪效率計算機</h1>

    <!-- 分頁導覽列 -->
    <div id="tabsContainer" class="flex flex-wrap gap-2 mb-6 border-b pb-4">
      <!-- 動態生成分頁按鈕 -->
    </div>
    <button onclick="addNewTab()" class="mb-4 bg-green-500 text-white px-3 py-1 rounded text-sm">+ 新增計算分頁</button>

    <!-- 當前分頁內容區域 -->
    <div id="tabContent" class="space-y-6">
      
      <!-- 署名設定 -->
      <div>
        <label class="block text-sm font-semibold text-gray-600">分頁署名 / 記號：</label>
        <input type="text" id="tabName" oninput="updateTabMeta()" class="border rounded p-1 w-full max-w-xs" placeholder="例如：小明的測試區">
      </div>

      <!-- 1. 測試時間區間 (改為手動輸入分鐘) -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">⏱️ 1. 測試時間區間 (分鐘)：</label>
        <input type="number" id="testMinutes" oninput="saveData()" class="w-full border rounded p-2" placeholder="請輸入分鐘數">
      </div>

      <!-- 2. 經驗值與楓幣統計 -->
      <div>
        <h2 class="font-bold text-gray-700 mb-2">📊 2. 經驗值與楓幣統計</h2>
        <div class="grid grid-cols-2 gap-4">
          <input type="number" id="expStart" oninput="saveData()" placeholder="開始經驗值" class="border p-2 rounded">
          <input type="number" id="expEnd" oninput="saveData()" placeholder="結束經驗值" class="border p-2 rounded">
          <input type="number" id="mesoStart" oninput="saveData()" placeholder="開始楓幣" class="border p-2 rounded">
          <input type="number" id="mesoEnd" oninput="saveData()" placeholder="結束楓幣" class="border p-2 rounded">
        </div>
      </div>

      <!-- 3. 掉落物統計 (特別保留：尾巴、觸角與價錢) -->
      <div class="border-t pt-4">
        <h2 class="font-bold text-gray-700 mb-2">🎒 3. 掉落物統計</h2>
        <div class="space-y-2">
          <div class="flex gap-4 items-center">
            <span class="w-24 font-medium">尾巴</span>
            <input type="number" id="itemTailQty" oninput="saveData()" placeholder="數量" class="border p-1 rounded w-32">
            <input type="number" id="itemTailPrice" oninput="saveData()" placeholder="單價" class="border p-1 rounded w-32">
          </div>
          <div class="flex gap-4 items-center">
            <span class="w-24 font-medium">觸角</span>
            <input type="number" id="itemAntennaQty" oninput="saveData()" placeholder="數量" class="border p-1 rounded w-32">
            <input type="number" id="itemAntennaPrice" oninput="saveData()" placeholder="單價" class="border p-1 rounded w-32">
          </div>
        </div>
      </div>

      <!-- 操作按鈕列 -->
      <div class="flex gap-4 pt-4 border-t">
        <button onclick="clearNumbersKeepDrops()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600">
          清空數字（保留尾巴、觸角與價錢）
        </button>
      </div>

    </div>
  </div>

  <script>
    // 邏輯範例：點擊清空數字，但保留尾巴、觸角及其對應的數量與單價
    function clearNumbersKeepDrops() {
      // 清空時間與經驗、楓幣欄位
      document.getElementById('testMinutes').value = '';
      document.getElementById('expStart').value = '';
      document.getElementById('expEnd').value = '';
      document.getElementById('mesoStart').value = '';
      document.getElementById('mesoEnd').value = '';
      
      // 注意：這裡刻意不清除 itemTailQty, itemTailPrice, itemAntennaQty, itemAntennaPrice
      // 藉此達到「保留尾巴、觸角跟他們的價錢」的需求
      
      alert('已清空時間與經驗楓幣數據，已保留尾巴與觸角的數量及價錢！');
      saveData(); // 同步到資料庫
    }

    function saveData() {
      // 這裡可以接 Firebase Realtime Database 進行即時同步儲存
      // 例如 firebase.database().ref('calculator_tabs/' + currentTabId).set({...});
    }

    function updateTabMeta() {
      // 更新分頁標題與署名
    }

    function addNewTab() {
      // 新增分頁邏輯
    }
  </script>
</body>
</html>
